# reference_floors: SCAN_RE false-floor adversarial set + genuine-citation floor
# controls (W-SCANRE, 2026-08-22; pre-registered at
# docs/evidence/swarm-2026-08-22/w-scanre/PRE-REG.md).
#
# ROUTING-LEVEL suite — measured by scripts/probe-scan-floors.mts through
# resolveIntent (tier-level, per ADR-115), NOT through the compose->verify
# loop, so cases carry no `teacher` and no fixture. Grows the 2026-08-21
# adversarial set (n=10, "should grow") to n=36 non-citations + n=31 controls.
#
# expect vocabulary:
#   - floor_empty: resolveIntent(prompt).floor must be []  (idiomatic non-citation)
#   - floor_fires: resolveIntent(prompt).floor must be non-empty (genuine citation)
#
# Non-citation rules: the gated book word (mark/james/job/acts/numbers/kings)
# appears with digits in an idiom; no biblical-lexicon token and no pericope
# alias may appear elsewhere in the prompt (that would be corroboration).

