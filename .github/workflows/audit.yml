name: audit
# EVERY branch, not just main (owner ruling 2026-07-29). The old `branches: [main]`
# filter meant a feature branch was gated only if someone remembered to open a PR —
# and on 2026-07-28 five commits sat on `claude/adoring-babbage-7ac774` having
# triggered ZERO workflows, with the gate silent and the silence easy to read as
# green. Requiring a PR closes that only while the discipline holds, and discipline
# is precisely what failed. Actions minutes are cheaper than an invisible blind spot.
on:
  push:
  pull_request:

jobs:
  # Every non-DB gate: typecheck ×3 · lint ×2 · knip · deps-audit · tests+coverage · Gate B license.
  # The licensing + tenancy invariants (test/invariants/{licensing,tenancy}.test.ts) SKIP here —
  # requireDbInCi() only throws under REQUIRE_DB=1, which this job does not set. They get a real run
  # in the `db-invariants` job below. This job is designed to go GREEN on every push.
  audit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so diff-based checks work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run audit

  # The DB-backed behavioral invariants (licensing, tenancy) run against a real Neon TEST BRANCH.
  # SECURITY: this is a TEST branch, NEVER prod — the tenancy suite writes rows. Set its app_runtime
  # connection string as the repo secret APP_DATABASE_URL_TEST (see docs/SECURITY.md / OWNER_ACTIONS §1).
  #
  # FAIL-CLOSED (work-order v2 Stage 1.2): when APP_DATABASE_URL_TEST is absent this job is RED, not
  # a visible-green skip. A green db-invariants means the invariants ran. Run receipt: vitest JSON
  # executed-test count + ci-skip-ceiling.mjs output + NOT RUN annotations only for gitignored artifacts.
  db-invariants:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: db-invariants-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: require APP_DATABASE_URL_TEST (fail closed)
        env:
          DBURL: ${{ secrets.APP_DATABASE_URL_TEST }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "::error title=DB invariants NOT RUN::APP_DATABASE_URL_TEST is missing or empty — db-invariants must FAIL, not skip green. See OWNER_ACTIONS §1."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      # A GLOB, NOT A LIST (owner ruling 2026-07-29). This was an explicit 13-file
      # allowlist, which made every new invariant OPT-IN to CI — and forgetting to add
      # one was invisible. Both checks written on 2026-07-29 (register-end-to-end,
      # section-vector-pairing) were absent from it, so setting the secrets alone would
      # have left them not running, silently, by omission. That is the third costume of
      # the same silence: a missing secret, a skipping suite, and an unnamed file.
      # A directory glob fails CLOSED — a new invariant is covered the moment it exists.
      #
      # DEEPINFRA_API_KEY is here because section-vector-pairing re-embeds section bodies
      # with the SHIPPED embedder to detect content↔vector mispairing — the one defect
      # class no counting check can see (a vector rotation is a permutation, so counts,
      # 1:1 assertions and nearest-neighbour probes all stay green). Without the key that
      # suite announces NOT RUN via web/test/helpers/loud-skip.ts rather than skipping quietly.
      # ── the OWNER url for the four seeding suites ──────────────────────────────
      # library-published-boundary, sections-unit-ordinal, annotations-polymorphic and
      # annotation-tables SEED fixtures (INSERT INTO sources), which app_runtime is correctly
      # refused (migration 010: SELECT only). They resolve DATABASE_URL via seedOwnerUrl(),
      # which REFUSES production and accepts a non-dev endpoint only when SEED_TEST_ENDPOINT
      # declares it by exact id — so this step can never point them anywhere undeclared.
      #
      # Two sources, in order:
      #   1. secrets.DATABASE_URL_TEST_OWNER, if the owner has stored one.
      #   2. otherwise FETCHED AT RUNTIME with secrets.NEON_API_KEY, scoped to the declared
      #      test branch — no long-lived owner password stored anywhere. The fetched value is
      #      ::add-mask::'d BEFORE it is written to GITHUB_ENV (runtime-fetched strings are
      #      NOT auto-masked the way stored secrets are).
      # With neither, the suites announce NOT RUN via helpers/loud-skip.ts — never silence.
      #
      # This step is the ONLY writer of DATABASE_URL. Deliberately NOT a step-level `env:` on
      # the vitest step: `${{ secrets.X }}` renders as an EMPTY STRING when unset, and a
      # step-level empty DATABASE_URL would shadow the value written to GITHUB_ENV here.
      - name: resolve seed-owner DATABASE_URL (secret, else fetched via NEON_API_KEY)
        env:
          OWNER_SECRET: ${{ secrets.DATABASE_URL_TEST_OWNER }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          SEED_BRANCH: ci-test-20260729
          NEON_PROJECT: spring-heart-74819093
        run: |
          if [ -n "$OWNER_SECRET" ]; then
            echo "DATABASE_URL=$OWNER_SECRET" >> "$GITHUB_ENV"
            echo "seed owner: using DATABASE_URL_TEST_OWNER secret"
          elif [ -n "$NEON_API_KEY" ]; then
            URL=$(npx --yes neonctl connection-string "$SEED_BRANCH" --project-id "$NEON_PROJECT" \
              --role-name neondb_owner --database-name neondb --api-key "$NEON_API_KEY" 2>/dev/null | tr -d '\n')
            if [ -z "$URL" ]; then
              echo "::error title=seed-owner URL not fetched::neonctl returned nothing for branch $SEED_BRANCH — db-invariants must fail when seed owner is unavailable."
              exit 1
            else
              echo "::add-mask::$URL"
              echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
              echo "seed owner: fetched at runtime for $SEED_BRANCH (no stored owner secret)"
            fi
          else
            echo "::error title=seed-owner URL absent::neither DATABASE_URL_TEST_OWNER nor NEON_API_KEY is set — seeding suites cannot run; db-invariants must fail."
            exit 1
          fi
      - name: require DEEPINFRA_API_KEY (fail closed)
        env:
          KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=DEEPINFRA_API_KEY missing::section-vector-pairing cannot run — db-invariants must fail, not skip green."
            exit 1
          fi
      - name: DB-backed invariants (real DB) — whole directory, no allowlist
        working-directory: web
        env:
          REQUIRE_DB: '1'
          REQUIRE_SECRETS: '1'
          # app_runtime — the read paths, RLS and tenancy suites. Least privilege on purpose:
          # owner would BYPASS RLS and make the tenancy suites pass while proving nothing.
          # (DATABASE_URL — the seed-owner url — arrives via GITHUB_ENV from the step above.)
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL_TEST }}
          # The declared seed target, by exact endpoint id. NOT a secret — it is the reviewable
          # statement of which database may be seeded and deleted from. seedOwnerUrl() refuses
          # production regardless of what is declared here.
          SEED_TEST_ENDPOINT: ep-tiny-bonus-at3izo3y
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT: spring-heart-74819093
          DB_INVARIANTS_SKIP_CEILING: '0'
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          corepack pnpm exec vitest run test/invariants/ \
            --reporter=default --reporter=json --outputFile=../vitest-db-invariants.json
          node ../scripts/ci-skip-ceiling.mjs ../vitest-db-invariants.json
          node ../scripts/ci-db-invariants-receipt.mjs ../vitest-db-invariants.json
