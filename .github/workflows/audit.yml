name: audit
# EVERY branch, not just main (owner ruling 2026-07-29). The old `branches: [main]`
# filter meant a feature branch was gated only if someone remembered to open a PR —
# and on 2026-07-28 five commits sat on `claude/adoring-babbage-7ac774` having
# triggered ZERO workflows, with the gate silent and the silence easy to read as
# green. Requiring a PR closes that only while the discipline holds, and discipline
# is precisely what failed. Actions minutes are cheaper than an invisible blind spot.
#
# pull_request REMOVED (work-order v2 PR #44 round 3): push + pull_request on the same
# branch produced two workflow runs per sha — push could fail db-invariants while a later
# pull_request run skipped both jobs, and GitHub treated skipped as passing, masking red.
# Tradeoff: CI runs on push only; PRs from the same repo are gated when the branch is
# pushed (standard for fork-less workflows). See ADR-040 in docs/DECISIONS.md.
on:
  push:

jobs:
  # Every non-DB gate: typecheck ×3 · lint ×2 · knip · deps-audit · tests+coverage · Gate B license.
  # The licensing + tenancy invariants (test/invariants/{licensing,tenancy}.test.ts) SKIP here —
  # requireDbInCi() only throws under REQUIRE_DB=1, which this job does not set. They get a real run
  # in the `db-invariants` job below. This job is designed to go GREEN on every push.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so diff-based checks work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run audit

      # BUILD THE PRODUCT. Until 2026-08-01 nothing in CI compiled the app: this job ran
      # typecheck, lint, knip, deps-audit and tests, and `db-invariants` ran DB suites. Neither
      # ran `next build`. The consequence was not hypothetical — the production build sat BROKEN
      # at HEAD with every check green, because both /api/ask routes exported
      # `maxDuration = ASK_MAX_DURATION_SEC` and Next 16 rejects a non-literal segment config.
      # `web/test/teach-budget.test.ts` was simultaneously asserting that binding MUST be the
      # identifier, so a green test enforced a property that made the product unbuildable and the
      # two signals never met. The only thing that would ever have caught it is the deploy itself,
      # at step 6 of 7, with the owner watching.
      #
      # COST, measured on this repo rather than estimated: 7s cold (after `rm -rf web/.next`) and
      # 7s warm. Turbopack compiles in ~2.8s; the rest is typegen and page-data collection. CI
      # will be slower than a warm laptop, but this is seconds on a job that already installs a
      # pnpm workspace and runs a coverage suite. That is the price of "a commit that does not
      # build cannot be green".
      #
      # The wrapper exists because Next reports segment-config errors WITHOUT naming a route
      # ("Invalid segment configuration export detected. ... You should see the relevant failures
      # in the logs above." — there were none). A bare failure here is unactionable, so the step
      # says what to look at.
      - name: build — next build (the product must compile)
        working-directory: web
        run: |
          set -o pipefail
          if ! npx next build 2>&1 | tee /tmp/next-build.log; then
            echo "::error title=next build failed::The production build does not compile at this commit. Deploy A would fail at deploy.sh step 6 of 7."
            if grep -q "Invalid segment configuration" /tmp/next-build.log; then
              echo "::error title=Invalid route segment config::Next names no route for this error. Look for a NON-LITERAL route segment export (dynamic/revalidate/runtime/maxDuration/fetchCache/preferredRegion/dynamicParams) — these must be statically analysable literals, not imported constants. Check: grep -rn '^export const \(dynamic\|revalidate\|runtime\|maxDuration\|fetchCache\|preferredRegion\|dynamicParams\)' web/src/app"
            fi
            exit 1
          fi

  # The DB-backed behavioral invariants (licensing, tenancy) run against a real Neon TEST BRANCH.
  # SECURITY: this is a TEST branch, NEVER prod — the tenancy suite writes rows. Set its app_runtime
  # connection string as the repo secret APP_DATABASE_URL_TEST (see docs/SECURITY.md / OWNER_ACTIONS §1).
  #
  # FAIL-CLOSED (work-order v2 Stage 1.2): when APP_DATABASE_URL_TEST is absent this job is RED, not
  # a visible-green skip. A green db-invariants means the invariants ran. Run receipt: vitest JSON
  # executed-test count + ci-skip-ceiling.mjs output + NOT RUN annotations only for gitignored artifacts.
  db-invariants:
    runs-on: ubuntu-latest
    # CONCURRENCY, re-keyed 2026-08-21 from repo-wide to per-REF.
    #
    # The old `db-invariants-${{ github.repository }}` with `cancel-in-progress: false` allowed one
    # running plus one pending run FOR THE WHOLE REPO, so a third push cancelled the pending one
    # while it was still queued. With four sessions pushing, that is most pushes. MEASURED over the
    # last 20 runs on this branch: 9 cancelled · 9 failure · 2 never ran · **0 succeeded** — the gate
    # executed about 45% of the time, and a gate that mostly does not run is a gate in name only.
    #
    # The repo-wide key existed for a real reason: every run migrated and seeded ONE shared test
    # branch, so two concurrent runs would have collided. The per-run ephemeral branch above removes
    # that constraint entirely — each run now has its own database and cannot collide with anything.
    #
    # WHY PER-REF AND NOT PER-SHA. Per-sha gates every commit but leaves runs unbounded: a push storm
    # means one live Neon branch per superseded commit, for commits that are no longer the branch
    # head and whose verdict nobody needs. Per-ref gates the LATEST commit on each branch, cancels
    # superseded same-branch runs, and bounds concurrent ephemeral branches by ACTIVE REFS rather
    # than push rate. On this repo, where the sessions share one branch, that is effectively one
    # concurrent run — the same bound as before, without the starvation.
    #
    # NEON BRANCH CAP: **NOT READ — the API key does not expose plan limits** (`/users/me` returns no
    # plan, the project object carries only a logical-size limit). MEASURED instead: 9 branches exist
    # today. Per-ref keeps the ephemeral count at roughly one, so the cap is not load-bearing here;
    # it WOULD be under per-sha, which is the second reason not to use it. Read the cap before
    # raising concurrency any further.
    #
    # THE RISK THIS INTRODUCES, and it is new: `cancel-in-progress: true` cancels a RUNNING job, not
    # just a queued one. Under the old setting a cancelled run had never started, so no ephemeral
    # branch existed to leak. Now the `delete ephemeral Neon branch` step's `if: always()` is
    # load-bearing on the cancellation path. Red-proofed by superseding a live run and confirming
    # zero `ci-eph-*` branches survive — see the commit that made this change.
    concurrency:
      group: db-invariants-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: require APP_DATABASE_URL_TEST (fail closed)
        env:
          DBURL: ${{ secrets.APP_DATABASE_URL_TEST }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "::error title=DB invariants NOT RUN::APP_DATABASE_URL_TEST is missing or empty — db-invariants must FAIL, not skip green. See OWNER_ACTIONS §1."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      # ── EPHEMERAL TEST BRANCH (2026-08-21) ────────────────────────────────────
      # Every run gets its OWN copy-on-write Neon branch, cut from the long-lived CI parent,
      # and deletes it at the end. Why: this job used to migrate ONE persistent branch, and
      # the comments below are the record of what that cost — `main` red for 12 consecutive
      # runs across 3 days, a FORGET list that erased 044's ledger row on every run (so a run
      # that finally completed 044 had its record deleted before the next one started), a
      # 35-minute wedge, and 044 finally applied out of band by hand.
      #
      # A branch born as a copy of the parent cannot have a drifting ledger, and cannot carry
      # another run's half-applied migration or leftover fixture rows. The tenancy suites
      # INSERT and DELETE; today they do that to shared state that the next run inherits.
      #
      # PARENT CHOICE — `dev`, changed from `ci-test-20260729` on 2026-08-21, and this is the
      # substantive half of the change.
      #
      # `ci-test-20260729` was cut on 2026-07-29, BEFORE essentially every served row in this
      # product landed (the topical publish, the P4.n batches, the 28-work history corpus,
      # gill-song, barnes-crosswire-nt). So four suites that assert properties OF SERVED CONTENT
      # could not exercise them and failed on their own preconditions — `catalog "devotionals"
      # must have works`, `must serve all 9 voices; MISSING: Jamieson (JFB)`, `the corpus must
      # contain lane/other works`, `seed plan refused: no commentary coverage on this passage`.
      # That is a gate that CANNOT go green, which is worse than an absent one: it teaches
      # everyone that red means "probably fine". Five deploys shipped through it.
      #
      # MEASURED on `dev` before switching (read-only, 2026-08-21): 15 published devotional works,
      # 9,878 served JFB rows, 131,569 rows in the served legal pool. The starved preconditions
      # are satisfied there.
      #
      # THE NEW TRADE, and it is the opposite of the old one. `dev` advances with real work, so
      # the pending-migration set stays near empty instead of an expensive migration being paid
      # per run. In exchange the gate's data moves under you: a future ingest can redden CI for
      # reasons unrelated to the commit under test. That is the known cost of "green but
      # drifting"; the alternative is a purpose-seeded branch that is stable but needs upkeep.
      # Revisit if drift starts producing reds nobody can attribute.
      #
      # WRITES ARE SAFE, and only because of the ephemeral design above: the tenancy suites
      # INSERT and DELETE, and they now do that to a per-run throwaway copy that is dropped at
      # the end. Pointing the OLD shared-branch job at `dev` would have mutated the working dev
      # database on every run.
      #
      # THIS DOES NOT MAKE THE JOB GREEN, and nobody should read it that way. Two failures
      # survive, both real and both filed: `history-scope-db` (dev carries 81 served anchored
      # entities but only 31 are inside the shipped `vocab()` scope, so its probe draws an
      # out-of-scope label ~62% of the time — a TRUE POSITIVE for the entity scope leak, not
      # flake), and `neon-auth-live` (missing NEON_AUTH_* secrets — needs the secrets or
      # conversion to the loud-skip helper so it reports NOT RUN honestly). What this change buys
      # is that the remaining red MEANS something.
      #
      # SAFETY. The endpoint id is created at runtime, so it can no longer be a reviewable
      # literal in this file. The load-bearing rail is unaffected: `isAuditAllowedHost`
      # (apply-pending.mjs) and the PROD_ENDPOINT prefix check in web/test/helpers/env.ts both
      # refuse production regardless of what is declared. The assertion below adds the check
      # this file used to make by being readable — it fails the job if the branch we just
      # created is anywhere near the production endpoint, before any URL is exported.
      - name: create ephemeral Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT: spring-heart-74819093
          PARENT_BRANCH: dev
          PROD_ENDPOINT_PREFIX: ep-odd-fog
          APP_URL_TEMPLATE: ${{ secrets.APP_DATABASE_URL_TEST }}
        run: |
          set -euo pipefail
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error title=NEON_API_KEY missing::the ephemeral test branch cannot be created — db-invariants must fail, not skip green."
            exit 1
          fi
          BRANCH="ci-eph-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Exported FIRST, before any step that can fail, so the always() cleanup below can
          # still find and delete the branch if creation half-succeeded.
          echo "EPH_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          npx --yes neonctl branches create \
            --project-id "$NEON_PROJECT" --parent "$PARENT_BRANCH" --name "$BRANCH" \
            --api-key "$NEON_API_KEY" --output json > /tmp/eph-branch.json
          OWNER_URL=$(npx --yes neonctl connection-string "$BRANCH" --project-id "$NEON_PROJECT" \
            --role-name neondb_owner --database-name neondb --api-key "$NEON_API_KEY" | tr -d '\n')
          if [ -z "$OWNER_URL" ]; then
            echo "::error title=ephemeral branch has no owner URL::neonctl returned nothing for $BRANCH."
            exit 1
          fi
          echo "::add-mask::$OWNER_URL"
          # Endpoint id computed EXACTLY as web/test/helpers/env.ts endpointIdOf() computes it
          # (first label of the host), so the declared id and the parsed id cannot disagree.
          EP=$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname.split(".")[0])' "$OWNER_URL")
          case "$EP" in
            "$PROD_ENDPOINT_PREFIX"*)
              echo "::error title=REFUSING::ephemeral branch resolved to the production endpoint ($EP). Nothing was exported."
              exit 1 ;;
          esac
          echo "ephemeral branch $BRANCH → endpoint $EP (parent $PARENT_BRANCH)"
          echo "DATABASE_URL=$OWNER_URL" >> "$GITHUB_ENV"
          echo "MIGRATE_TARGET_ENDPOINT=$EP" >> "$GITHUB_ENV"
          echo "SEED_TEST_ENDPOINT=$EP" >> "$GITHUB_ENV"
          # app_runtime is a SQL-created role, not a Neon-managed one, so neonctl cannot mint a
          # connection string for it. A branch clones pg_authid, so the role and its password are
          # identical on the child — swap the HOST of the existing secret and keep everything else.
          # Pooling is preserved: the repo's transaction-local set_config guarantee is proven
          # through the pooler, and silently moving CI to a direct connection would drop that.
          APP_EPH=$(OWNER_URL="$OWNER_URL" APP_URL="$APP_URL_TEMPLATE" node -e '
            const o = new URL(process.env.OWNER_URL), a = new URL(process.env.APP_URL);
            const rest = o.hostname.split(".").slice(1).join(".");
            const pooled = a.hostname.split(".")[0].endsWith("-pooler");
            a.hostname = (pooled ? o.hostname.split(".")[0] + "-pooler" : o.hostname.split(".")[0]) + "." + rest;
            process.stdout.write(a.toString());
          ')
          echo "::add-mask::$APP_EPH"
          echo "APP_DATABASE_URL=$APP_EPH" >> "$GITHUB_ENV"

      # A GLOB, NOT A LIST (owner ruling 2026-07-29). This was an explicit 13-file
      # allowlist, which made every new invariant OPT-IN to CI — and forgetting to add
      # one was invisible. Both checks written on 2026-07-29 (register-end-to-end,
      # section-vector-pairing) were absent from it, so setting the secrets alone would
      # have left them not running, silently, by omission. That is the third costume of
      # the same silence: a missing secret, a skipping suite, and an unnamed file.
      # A directory glob fails CLOSED — a new invariant is covered the moment it exists.
      #
      # DEEPINFRA_API_KEY is here because section-vector-pairing re-embeds section bodies
      # with the SHIPPED embedder to detect content↔vector mispairing — the one defect
      # class no counting check can see (a vector rotation is a permutation, so counts,
      # 1:1 assertions and nearest-neighbour probes all stay green). Without the key that
      # suite announces NOT RUN via web/test/helpers/loud-skip.ts rather than skipping quietly.
      # ── the OWNER url for the four seeding suites ──────────────────────────────
      # library-published-boundary, sections-unit-ordinal, annotations-polymorphic and
      # annotation-tables SEED fixtures (INSERT INTO sources), which app_runtime is correctly
      # refused (migration 010: SELECT only). They resolve DATABASE_URL via seedOwnerUrl(),
      # which REFUSES production and accepts a non-dev endpoint only when SEED_TEST_ENDPOINT
      # declares it by exact id — so this step can never point them anywhere undeclared.
      #
      # Two sources, in order:
      #   1. secrets.DATABASE_URL_TEST_OWNER, if the owner has stored one.
      #   2. otherwise FETCHED AT RUNTIME with secrets.NEON_API_KEY, scoped to the declared
      #      test branch — no long-lived owner password stored anywhere. The fetched value is
      #      ::add-mask::'d BEFORE it is written to GITHUB_ENV (runtime-fetched strings are
      #      NOT auto-masked the way stored secrets are).
      # With neither, the suites announce NOT RUN via helpers/loud-skip.ts — never silence.
      #
      # DATABASE_URL (the seed-owner connection) is written by the ephemeral-branch step above and
      # nowhere else. It used to be resolved here, either from a stored DATABASE_URL_TEST_OWNER
      # secret or fetched for the persistent branch; BOTH would now point at the PARENT rather than
      # at this run's branch, so the step is gone rather than kept-and-ignored. The fail-closed
      # posture it carried moved with it: no NEON_API_KEY is a hard failure up there, not a skip.
      #
      # Still true, and the reason DATABASE_URL is never a step-level `env:` on the vitest step:
      # `${{ secrets.X }}` renders as an EMPTY STRING when unset, and a step-level empty value
      # would shadow what GITHUB_ENV wrote.
      - name: require DEEPINFRA_API_KEY (fail closed)
        env:
          KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=DEEPINFRA_API_KEY missing::section-vector-pairing cannot run — db-invariants must fail, not skip green."
            exit 1
          fi
      # WITHOUT THIS STEP THE GATE CANNOT SEE THE SCHEMA IT TESTS. Added 2026-08-07 after `main`
      # had failed 12 consecutive runs, continuously since 2026-08-05 — the day migration 104
      # landed. Four tests were failing with `relation "auth_users" does not exist`: the migration
      # was applied to prod and dev and never to this branch, and nothing in the job applied it or
      # noticed. Three days red on a repo whose rule is "nothing merges red".
      #
      # The target is declared by exact endpoint id, the same reviewable statement SEED_TEST_ENDPOINT
      # already makes below. apply-pending.mjs refuses production regardless of what is declared and
      # has no MIGRATE_ALLOW_PROD escape hatch.
      # DIAGNOSTIC, read-only. Prints the ledger and the real table inventory so the bootstrap
      # assumption below can be DERIVED rather than guessed. Two guesses cost two CI runs on
      # 2026-08-08; this answers it in one. Safe to keep — it changes nothing and the output is the
      # record of what the target actually held.
      # MIGRATE_TARGET_ENDPOINT arrives from GITHUB_ENV (the ephemeral branch), so there is no
      # step-level literal here any more — a literal would name the parent and shadow it.
      - name: describe the test branch (read-only)
        run: node db/describe-target.mjs

      # CI corpus assets (docs/pm/orders/2026-08-22-ci-corpus-assets.md, ADR-119 family 3):
      # web/public/bible is gitignored, and five DB-backed suites plus the drain's ADR-100
      # translation detection need it (run 32559250346's blob-round-trip red named the ENOENT;
      # the kjv-only first slice then woke translation-detect, which asserts the real shipped
      # 18-translation set). Content-addressed cache keyed on the committed CDN manifest's
      # per-file sha256 set; on a miss the fetch script downloads and VERIFIES every file,
      # installs atomically, and on any failure warns + exits 0 so the suites announceSkip kind
      # `artifact` instead of a meaningless red. Measured 2026-08-22: cold 75.2s (22,590 files,
      # 186MB, all 18 translations), fast-path instant; warm is the cache restore below.
      # commentaries/ (~850MB) stays out per the order.
      - name: bible assets — cache key from the manifest
        id: biblekey
        run: echo "key=$(node scripts/ci-fetch-bible-assets.mjs --print-cache-key)" >> "$GITHUB_OUTPUT"
      # restore/save SPLIT, deliberately: the combined actions/cache saves post-job, and a run
      # that fails its tests never seeded the cache (run 32560946966: "Cache not found" one run
      # after a complete 22,590-file fetch). Saving IMMEDIATELY after a verified-complete fetch
      # means one successful fetch ever is enough, whatever the tests later do. The save is
      # guarded by the script's --check (all files present at manifest size), so a failed fetch
      # can never seed a poisoned cache.
      - name: bible assets — restore cache
        id: biblerestore
        uses: actions/cache/restore@v4
        with:
          path: web/public/bible
          key: ${{ steps.biblekey.outputs.key }}
      - name: bible assets — fetch on miss (verified, atomic, fail-open to the honest skip)
        run: node scripts/ci-fetch-bible-assets.mjs
      - name: bible assets — completeness for the save guard
        id: bibledone
        run: |
          if node scripts/ci-fetch-bible-assets.mjs --check; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: bible assets — save cache (only a verified-complete tree)
        if: steps.biblerestore.outputs.cache-hit != 'true' && steps.bibledone.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: web/public/bible
          key: ${{ steps.biblekey.outputs.key }}

      # timeout-minutes, because this step wedged CI for 35 minutes on 2026-08-08 (CONCURRENTLY in
      # an implicit transaction) with no output and no failure. An unbounded migration step is a way
      # for one bad file to block every future run.
      #
      # 10 -> 30 on 2026-08-15, blaming 113/114/115. CORRECTED 2026-08-18: THOSE FILES NEVER RAN.
      # With a per-migration start line in the log, run 32108864575 named the culprit in one line —
      # `▶ applying 044_embeddings_served_expand.sql …`, then the timeout, with 045-116 untouched.
      # The old text was wrong in three further ways, each measured: 114 is FREE (its predicate
      # `served AND source_type='historian'` matches 0 rows); there are FOUR pending GIN rebuilds
      # (108/109/113/115), not three; and commentary_entries holds 191,749 rows, not 162k. A number
      # reasoned about rather than measured sent the last diagnosis at the wrong four files.
      # Run 31910463039 timed out at 10:00 (the CONCURRENTLY wedge it was written against is separately handled —
      # apply-pending.mjs splits those statements outside transactions; see its :185 comment).
      # This is the watchlist's instance-fifteen shape: a cited premise nothing re-checks.
      - name: apply pending migrations to the test branch
        timeout-minutes: 30
      # NO `env:` BLOCK HERE, and it must stay absent rather than become empty. When this step's
      # last key (MIGRATE_TARGET_ENDPOINT, now supplied by GITHUB_ENV) was replaced with comments,
      # `env:` was left with only comments under it — which YAML reads as `env: null` and GitHub
      # Actions rejects at workflow-validation time, before any job is created. The run then fails
      # with "This run likely failed because of a workflow file issue", no jobs, and no log to read.
      # A local `yaml.safe_load` cannot see it: null is perfectly valid YAML. Caught by
      # @action-validator/cli and now guarded by test/invariants/ci-ephemeral-branch.test.ts.
      #
      # MIGRATE_TARGET_ENDPOINT arrives from GITHUB_ENV (the ephemeral branch). The history below
      # is kept because it is the argument for cutting a fresh branch per run: every entry in it is
      # a way that topping up ONE shared branch went wrong.
      #
          # DERIVED, not guessed — db/describe-target.mjs read the branch on 2026-08-08 and reported
          # 039 and 042 as missing. 044/045 were added after `licensing.test.ts` then failed with
          # `column "served" does not exist` — a table-presence check cannot see a migration that
          # ALTERS, which is why describe-target now checks columns too. Missing were
          # the ONLY missing migrations; 100/104/105 and everything else were present. The earlier
          # bootstrap had recorded 039 and 042 as applied because they fall below the declared
          # cutoff, so they must be forgotten before they can be applied. ONE-SHOT: remove after the
          # next green run, when it becomes a no-op.
          # ONLY 44,45 — 039 and 042 were applied by the 03:43 run, and re-forgetting them made the
          # next run try to re-apply non-idempotent DDL (`relation "plans" already exists`). A
          # one-shot list must be REPLACED each time, not widened. Remove this line entirely once
          # the run is green; leaving it re-forgets every run and breaks the same way.
          # 039 and 042 ARE applied (a previous run did it) but lost their ledger rows to an
          # over-wide forget, so assert them back without running. 044/045 are genuinely missing —
          # the column read says `embeddings.served` is absent — so they stay in the forget list.
          # BOTH lines are one-shot: delete them once the run is green.
          # BOTH ONE-SHOT LINES REMOVED 2026-08-18, and the FORGET one was load-bearing in the
          # wrong direction. Its own comment said "delete once the run is green" — but while it is
          # present it DELETES 044's ledger row on every run, so a run that finally completed 044
          # would have its record erased before the next one started. Removal is a PRECONDITION
          # for convergence, not a reward for it. That inversion is why 044 re-ran forever.
          #
          # 039/042 are present on the branch (describe-target: "PRESENCE BY MIGRATION: 039 ALL
          # PRESENT, 042 ALL PRESENT") and their ledger rows were asserted back by earlier runs, so
          # MARK_APPLIED is now a no-op and goes with it.
          #
          # 044 was applied OUT OF BAND on 2026-08-18 via db/apply-migration-concurrent.mjs — the
          # runner its own header names, which carries the invalid-index pre-clean and the
          # validity assert — because its backfill legs 3 and 4 (162,507 + 33,578 rows) plus six
          # index builds do not fit a 30-minute step and were restarted from zero every run.
          # See docs/pm/orders/2026-08-18-ci-db-invariants-diagnosis.md.
        run: node db/apply-pending.mjs

      - name: DB-backed invariants (real DB) — whole directory, no allowlist
        working-directory: web
        env:
          REQUIRE_DB: '1'
          REQUIRE_SECRETS: '1'
          # APP_DATABASE_URL (app_runtime — least privilege on purpose: owner would BYPASS RLS and
          # make the tenancy suites pass while proving nothing), DATABASE_URL (the seed owner) and
          # SEED_TEST_ENDPOINT all arrive via GITHUB_ENV from the ephemeral-branch step. None may be
          # a step-level `env:` here: an unset `${{ secrets.X }}` renders as an EMPTY STRING and
          # would shadow the real value.
          #
          # SEED_TEST_ENDPOINT was a literal in this file — the reviewable statement of which
          # database may be seeded and deleted from. With a per-run branch that id does not exist
          # until the run starts, so the statement moved into the create step, which refuses to
          # export anything if the branch it just made resolves near production. seedOwnerUrl()
          # still refuses production independently, whatever is declared.
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          # Owner ruling 2026-08-22: blob-round-trip EXECUTES in CI rather than being exempted —
          # the @vercel/blob network hop is the one thing that suite proves and no local run
          # substitutes for it. Safe as a step-level env (unlike the GITHUB_ENV trio above): no
          # other source sets it, so an unset secret rendering as '' shadows nothing. Until the
          # secret exists the suite FAILS LOUDLY under REQUIRE_SECRETS=1 naming this variable,
          # which is the intended signal, not a regression.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT: spring-heart-74819093
          # clientIp() returns null for a synthetic Request, so publicReadThrottle collapses every
          # caller in the suite into ONE bucket (`read:{route}:no-trusted-ip`) and the suite trips
          # its own 120/min limit — 6 of the 13 failures on 2026-08-07 were `expected 429`. Raised
          # here ONLY, so the reader tests exercise the route instead of the throttle. The throttle
          # keeps its own dedicated coverage in web/test/invariants/api-hardening.test.ts, which
          # sets its own limit and is unaffected by this.
          PUBLIC_READ_LIMIT_PER_MIN: '100000'
          DB_INVARIANTS_SKIP_CEILING: '0'
          LOUD_SKIP_MANIFEST: ../loud-skip-manifest.json
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          rm -f ../loud-skip-manifest.json
          # test/user-corpus/ rides with the invariants (D3, 2026-08-21): the Lane B uploader
          # suites — routes, queue-never-drops, search, pipeline-to-ready, tradition-gap — need
          # credentials that only THIS job holds, so under the audit job they skipped: 62 tests,
          # exit 0, green over the whole My Works feature without executing it. Same glob
          # discipline as the invariants dir: a new user-corpus suite is covered the moment it
          # exists. (blob-round-trip / real-files / calibration remain env-gated NOT-RUNs — they
          # need operator-local stores/corpora — and announce themselves via loud-skip.)
          corepack pnpm exec vitest run test/invariants/ test/user-corpus/ \
            --reporter=default --reporter=json --outputFile=../vitest-db-invariants.json
          node ../scripts/ci-skip-ceiling.mjs ../vitest-db-invariants.json
          node ../scripts/ci-db-invariants-receipt.mjs ../vitest-db-invariants.json

      # always(), because a branch that outlives its run is the failure mode that turns this from
      # a cleanup problem into a quota problem — Neon caps branches per project, and the run that
      # first hits the cap fails for a reason that has nothing to do with the commit under test.
      # A delete failure is a WARNING, not a job failure: the tests have already reported by here,
      # and turning a successful invariants run red over a leaked branch would train people to
      # ignore this job. The warning names the branch so a sweep is one command.
      - name: delete ephemeral Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT: spring-heart-74819093
        run: |
          if [ -z "${EPH_BRANCH:-}" ]; then
            echo "no ephemeral branch was created — nothing to delete"
            exit 0
          fi
          if [ -z "$NEON_API_KEY" ]; then
            echo "::warning title=ephemeral branch NOT deleted::no NEON_API_KEY; delete $EPH_BRANCH by hand."
            exit 0
          fi
          if npx --yes neonctl branches delete "$EPH_BRANCH" \
               --project-id "$NEON_PROJECT" --api-key "$NEON_API_KEY"; then
            echo "deleted ephemeral branch $EPH_BRANCH"
          else
            echo "::warning title=ephemeral branch NOT deleted::neonctl could not delete $EPH_BRANCH. Sweep it: npx neonctl branches delete $EPH_BRANCH --project-id $NEON_PROJECT"
          fi
