name: audit
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every non-DB gate: typecheck ×3 · lint ×2 · knip · deps-audit · tests+coverage · Gate B license.
  # The licensing + tenancy invariants (test/invariants/{licensing,tenancy}.test.ts) SKIP here —
  # requireDbInCi() only throws under REQUIRE_DB=1, which this job does not set. They get a real run
  # in the `db-invariants` job below. This job is designed to go GREEN on every push.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so diff-based checks work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run audit

  # The DB-backed behavioral invariants (licensing, tenancy) run against a real Neon TEST BRANCH.
  # SECURITY: this is a TEST branch, NEVER prod — the tenancy suite writes rows. Set its app_runtime
  # connection string as the repo secret APP_DATABASE_URL_TEST (see docs/SECURITY.md / OWNER_ACTIONS §1).
  #
  # Until that secret exists, the guard step below short-circuits: the job is GREEN but every real step
  # is skipped and a loud ::warning:: records that the invariants did NOT run. This is the honest,
  # VISIBLE substitute for the old always-red push — a pending job, not an ignored failure. The moment
  # the secret is added, the tests run for real (REQUIRE_DB=1 makes a missing URL a hard failure here).
  db-invariants:
    runs-on: ubuntu-latest
    steps:
      - id: guard
        env:
          DBURL: ${{ secrets.APP_DATABASE_URL_TEST }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=DB invariants NOT RUN::ALL 13 DB-backed invariants were skipped — repo secret APP_DATABASE_URL_TEST (Neon TEST branch) is not set. This covers the published-status boundary, the register wall on real data, RLS tenancy, the annotation schema, keyset paging and unit_ordinal. Measured: 69 of 177 web tests do not execute without it. THIS JOB BEING GREEN DOES NOT MEAN THOSE INVARIANTS PASSED — it means they never ran. See OWNER_ACTIONS §1b."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.guard.outputs.run == 'true'
        run: corepack enable
      - if: steps.guard.outputs.run == 'true'
        run: corepack pnpm install --frozen-lockfile
      - if: steps.guard.outputs.run == 'true'
        name: licensing + tenancy invariants (real DB)
        working-directory: web
        env:
          REQUIRE_DB: '1'
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL_TEST }}
        run: corepack pnpm exec vitest run test/invariants/licensing.test.ts test/invariants/tenancy.test.ts test/invariants/library-published-boundary.test.ts test/invariants/register-wall-surfaces.test.ts test/invariants/search-sections.test.ts test/invariants/sections-unit-ordinal.test.ts test/invariants/annotations-polymorphic.test.ts test/invariants/annotation-rls-tenancy.test.ts test/invariants/annotation-tables.test.ts test/invariants/annotation-exact-substring.test.ts test/invariants/highlight-tenancy.test.ts test/invariants/work-reader.test.ts test/invariants/verse-keys.test.ts
