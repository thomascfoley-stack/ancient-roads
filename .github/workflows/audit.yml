name: audit
on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so diff-based checks work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run audit
        env:
          # SECURITY (§0): the licensing + tenancy invariants MUST EXECUTE in CI, not skip
          # (a green gate that ran zero assertions is worse than a red one). requireDbInCi()
          # THROWS when this is unset. To make CI green: create a Neon TEST BRANCH (NEVER
          # prod — the tenancy suite writes rows) and set its app_runtime connection string
          # as the repo secret APP_DATABASE_URL_TEST. See docs/SECURITY.md.
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL_TEST }}
